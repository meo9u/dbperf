  # One-shot seed loaders (profile "seed", never started by a plain `up`):
  #   docker compose --profile seed run --rm seed-mysql      # reload + verify; verify only: add /loaders/verify_mysql.sh
  #   docker compose --profile seed run --rm seed-mongodb    # reload + verify; verify only: add /loaders/verify_mongodb.sh
  seed-mysql:
    image: mysql:9.7.2
    container_name: dbperf-seed-mysql
    profiles: ["seed"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    volumes:
      - ./seed/loaders:/loaders:ro
      - ./seed/data:/seed-data:ro
      - mysql_files:/stage
    entrypoint: ["bash"]
    command: ["/loaders/load_mysql.sh"]
    networks:
      - dbperf-net

  seed-mongodb:
    image: mongo:8.0.32
    container_name: dbperf-seed-mongodb
    profiles: ["seed"]
    restart: "no"
    depends_on:
      mongodb-schema-init:
        condition: service_completed_successfully
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set in .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
    volumes:
      - ./seed/loaders:/loaders:ro
      - ./seed/data:/seed-data:ro
    entrypoint: ["bash"]
    command: ["/loaders/load_mongodb.sh"]
    networks:
      - dbperf-net

  # Data-logic checks (profile "seed"): run both, whichever runs second also compares with the first.
  #   docker compose --profile seed run --rm seed-check-mysql
  #   docker compose --profile seed run --rm seed-check-mongodb
  seed-check-mysql:
    image: mysql:9.7.2
    container_name: dbperf-seed-check-mysql
    profiles: ["seed"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    volumes:
      - ./seed/checks:/checks:ro
      - seed_results:/results
    entrypoint: ["bash"]
    command: ["/checks/check_mysql.sh"]
    networks:
      - dbperf-net

  seed-check-mongodb:
    image: mongo:8.0.32
    container_name: dbperf-seed-check-mongodb
    profiles: ["seed"]
    restart: "no"
    depends_on:
      mongodb-schema-init:
        condition: service_completed_successfully
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set in .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
    volumes:
      - ./seed/checks:/checks:ro
      - seed_results:/results
    entrypoint: ["bash"]
    command: ["/checks/check_mongodb.sh"]
    networks:
      - dbperf-net

volumes:
  mysql_data:
  mysql_files:
  seed_results:
  mongodb_data:
  mongodb_keyfile:
#   prometheus_data:
#   grafana_data:

networks:
  dbperf-net:
